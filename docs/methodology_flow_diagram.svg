  <text x="265" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">Hansen+BFD training labels vs. 600-pt reference — complete</text>

  <line x1="265" y1="570" x2="265" y2="620" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="598" font-family="Arial, sans-serif" font-size="10" fill="#444444">Gate 4: canopy threshold + BFD boundaries signed</text>

  <!-- Phase 5 -->
  <rect x="50" y="620" width="430" height="54" rx="6" fill="#d9f2d9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="265" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Phase 5 — Spatial block splits</text>
  <text x="265" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">10 km disjoint blocks, loss-balanced, 128 px patches — committed</text>

  <line x1="265" y1="674" x2="265" y2="724" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="702" font-family="Arial, sans-serif" font-size="10" fill="#444444">splits committed (data/splits/*.geojson)</text>

  <!-- Phase 6 -->
  <rect x="50" y="724" width="430" height="54" rx="6" fill="#fff4d6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="265" y="744" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Phase 6 — Model training (RF / U-Net / Siamese)</text>
  <text x="265" y="762" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">E1/E2 RF done (3 seeds); E3–E6 blocked on patch extraction — see detail →</text>

  <line x1="265" y1="778" x2="265" y2="828" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="806" font-family="Arial, sans-serif" font-size="10" fill="#444444">all experiments E1–E6 complete</text>

  <!-- Phase 7 -->
  <rect x="50" y="828" width="430" height="54" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
