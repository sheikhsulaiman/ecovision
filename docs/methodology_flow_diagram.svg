  <text x="265" y="866" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">PCC / NDVI-diff / Siamese; Bandarban jhum split — see detail →</text>

  <line x1="265" y1="882" x2="265" y2="932" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="910" font-family="Arial, sans-serif" font-size="10" fill="#444444">maps produced, all districts</text>

  <!-- Phase 8 -->
  <rect x="50" y="932" width="430" height="54" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
  <text x="265" y="952" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Phase 8 — Accuracy assessment &amp; area estimation</text>
  <text x="265" y="970" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">maps vs. independent reference sample; Olofsson (2014) area + 95% CI</text>

  <line x1="265" y1="986" x2="265" y2="1036" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="1014" font-family="Arial, sans-serif" font-size="10" fill="#444444">area/accuracy finalised, all districts</text>

  <!-- Phase 9 -->
  <rect x="50" y="1036" width="430" height="54" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5"/>
  <text x="265" y="1056" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Phase 9 — Cross-district analysis</text>
  <text x="265" y="1074" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">RQ1–RQ7 synthesis: model choice, texture, change method, jhum, unsupervised gap</text>

