  <text x="810" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#666666">Kaggle: no persistent disk between sessions; ≤30 GPU-hr/wk free tier</text>
  <text x="810" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#666666">— nothing survives a restart unless saved to Drive/Output first</text>

