<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1300" role="img"
     aria-label="EcoVision methodology flow: ten sequential phases from setup through cross-district analysis, each gated on a checkable condition, with two zoomed details — the local-to-Kaggle training round trip, and how Bandarban's LandTrendr trajectory separates cyclical jhum disturbance from permanent forest conversion where a plain two-date comparison cannot.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="1300" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#111111">EcoVision — Methodology Flow</text>
  <text x="550" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555555">Gazipur · Sylhet · Bandarban — deforestation detection, Landsat via Google Earth Engine — status as of 2026-08-22 (CLAUDE.md)</text>

  <!-- ============ SPINE: 12 phase boxes ============ -->
  <!-- helper positions: top = 100 + i*104, height 54, spine x=50 w=430 -->

  <!-- Phase 0 -->
  <rect x="50" y="100" width="430" height="54" rx="6" fill="#d9f2d9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="265" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Phase 0 — Setup &amp; access</text>
  <text x="265" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">GEE project, BFD request sent, repo scaffolded, split agreed</text>

  <line x1="265" y1="154" x2="265" y2="204" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="182" font-family="Arial, sans-serif" font-size="10" fill="#444444">Gate 0 passed</text>

  <!-- Phase 1 -->
  <rect x="50" y="204" width="430" height="54" rx="6" fill="#d9f2d9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="265" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Phase 1 — Study area &amp; forest definition</text>
  <text x="265" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">3-district AOI built; canopy threshold + class scheme signed</text>

  <line x1="265" y1="258" x2="265" y2="308" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="286" font-family="Arial, sans-serif" font-size="10" fill="#444444">Gate 1: forest def. + AOI signed</text>

  <!-- Phase 2 -->
  <rect x="50" y="308" width="430" height="54" rx="6" fill="#d9f2d9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="265" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Phase 2 — Scene availability audit</text>
  <text x="265" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">START_YEAR=1988; epochs T0 1990 / T1 2000 / T2 2010 / T3 2024</text>

  <line x1="265" y1="362" x2="265" y2="412" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="390" font-family="Arial, sans-serif" font-size="10" fill="#444444">Gate 2: START_YEAR / epochs confirmed [pending]</text>

  <!-- Phase 3 -->
  <rect x="50" y="412" width="430" height="54" rx="6" fill="#fff4d6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="265" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Phase 3 — Preprocessing</text>
  <text x="265" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#333333">23-band stack, cross-sensor harmonisation verified; composites held</text>

  <line x1="265" y1="466" x2="265" y2="516" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="494" font-family="Arial, sans-serif" font-size="10" fill="#444444">primitives verified (rule 6 check passing)</text>

  <!-- Phase 4 -->
  <rect x="50" y="516" width="430" height="54" rx="6" fill="#d9f2d9" stroke="#2e7d32" stroke-width="1.5"/>
